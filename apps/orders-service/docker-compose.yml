services:
  postgres:
    image: postgres:18
    container_name: orders-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orders-user
      POSTGRES_PASSWORD: orders-pass
      POSTGRES_DB: orders-db
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
