services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    container_name: restaurants-postgres
    environment:
      POSTGRES_DB: restaurants-db
      POSTGRES_USER: restaurants-user
      POSTGRES_PASSWORD: restaurants-pass
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql


volumes:
  postgres_data:
